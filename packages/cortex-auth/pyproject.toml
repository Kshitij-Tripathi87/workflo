[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-auth"
version = "1.1.1"
description = "Workflo CLI authentication — OAuth 2.0 Device Authorization Grant (RFC 8628), credential storage, and profile management."
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Workflo" }]
dependencies = [
    "httpx>=0.26.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.0", "respx>=0.20.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cortex_auth = ["py.typed"]
