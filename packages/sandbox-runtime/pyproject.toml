[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbox-runtime"
version = "0.1.0"
description = "Workflo sandbox runtime - Linux isolation with bwrap, cgroups v2, seccomp, Landlock"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "psutil>=5.9",
    "workflo-schema",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.10",
]
linux = [
    "python-seccomp>=1.0",
    "pyroute2>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sandbox_runtime = ["seccomp/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "linux: Linux integration gate (namespace executor on its target platform)",
]