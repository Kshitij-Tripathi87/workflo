[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workflo-probe-engine"
version = "1.1.1"
description = "Generalized, config-driven probe engine for workflo — replaces hardcoded isolation scenarios with declarative probe configs that run against any Python repo."
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "workflo" }]
dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "workflo-schema",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]
