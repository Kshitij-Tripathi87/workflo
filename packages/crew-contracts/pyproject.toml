[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workflo-crew-contracts"
version = "0.1.0"
description = "Typed handoff contracts between Workflo product agents (Analyst, Explorer, Judge, Reporter) and the deterministic services. Pydantic v2, extra=forbid, schema_version on every model."
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "workflo" }]
dependencies = [
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
