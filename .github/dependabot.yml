# Keep action pins and dependency manifests current. Paired with the
# immutable-SHA pinning of every `uses:` entry (tags are never referenced).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, github-actions]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, javascript]

  - package-ecosystem: npm
    directory: /apps/dashboard
    schedule:
      interval: weekly
    labels: [dependencies, javascript]

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    labels: [dependencies, javascript]

  - package-ecosystem: pip
    directory: /worker
    schedule:
      interval: weekly
    labels: [dependencies, python]

  - package-ecosystem: pip
    directory: /apps/control-plane
    schedule:
      interval: weekly
    labels: [dependencies, python]

  - package-ecosystem: pip
    directory: /apps/workflo-cli
    schedule:
      interval: weekly
    labels: [dependencies, python]

  - package-ecosystem: pip
    directory: /packages/workflo-schema
    schedule:
      interval: weekly
    labels: [dependencies, python]
