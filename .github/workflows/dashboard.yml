name: Dashboard CI

on:
  push:
    paths:
      - "apps/dashboard/**"
  pull_request:
    paths:
      - "apps/dashboard/**"

# Least privilege: these jobs only read the checkout and use repository
# secrets; none of them create releases, comment, or push.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install dependencies
        run: cd apps/dashboard && npm install
      - name: Build
        run: cd apps/dashboard && npm run build
