name: fresh-install-gate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Fresh-install gate: proves that a clean container can install workflo
# via install.sh, run workflo doctor, and execute a fixture run.
# This is the Day 1 green baseline gate — nothing is green unless this passes.

on:
  push:
    branches: [main, "p4/**", "arena/**"]
  pull_request:
    branches: [main, "p4/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-install-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Run fresh install in clean Docker container
        run: |
          docker run --rm -v "$PWD":/workflo -w /workflo \
            ubuntu:24.04 bash -c "
              set -e
              apt-get update -qq && apt-get install -qq -y python3 python3-venv python3-pip git >/dev/null
              chmod +x install.sh
              ./install.sh
              source .workflo-venv/bin/activate
              workflo --version
              workflo doctor
            "

      - name: Run fixture test in fresh container
        run: |
          docker run --rm -v "$PWD":/workflo -w /workflo \
            --privileged \
            ubuntu:24.04 bash -c "
              set -e
              apt-get update -qq && apt-get install -qq -y python3 python3-venv python3-pip git bubblewrap >/dev/null
              chmod +x install.sh
              ./install.sh
              source .workflo-venv/bin/activate
              # Create a minimal test fixture
              mkdir -p /tmp/fixture
              cd /tmp/fixture
              cat > requirements.txt <<'EOF'
pytest
EOF
              cat > test_sample.py <<'EOF'
def test_pass():
    assert True

def test_fail():
    assert False, 'intentional failure for fixture'
EOF
              workflo run --path /tmp/fixture --test --dry-run
              workflo run --path /tmp/fixture --test 2>&1 | tee /tmp/run.log
              # Verify the run produced a receipt
              ls -la .workflo/runs/
            "