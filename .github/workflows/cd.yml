name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Docker image references must be lowercase. `github.repository` keeps the
      # owner's casing ("Kshitij-Tripathi87/workflo"), so the previous
      # `ghcr.io/${{ github.repository }}-backend` tag was an invalid reference
      # and the push step failed on every run even though the image itself
      # built (ci.yml builds the same contexts with local tags and passes).
      - name: Resolve lowercase image prefix
        run: |
          set -euo pipefail
          prefix="${GITHUB_REPOSITORY,,}"
          echo "IMAGE_PREFIX=${prefix}" >> "$GITHUB_ENV"
          echo "Publishing as ${REGISTRY}/${prefix}-{backend,frontend}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend - build and push
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}

      - name: Frontend - build and push
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}

      # Print the registry digests that were actually produced. The previous
      # step printed `@<commit sha>`, which is not a digest and cannot be pulled.
      - name: Image digests
        run: |
          set -euo pipefail
          echo "Backend:  ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend@${{ steps.backend.outputs.digest }}"
          echo "Frontend: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend@${{ steps.frontend.outputs.digest }}"
          {
            echo "## Published images"
            echo
            echo "- backend: \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend@${{ steps.backend.outputs.digest }}\`"
            echo "- frontend: \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend@${{ steps.frontend.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
