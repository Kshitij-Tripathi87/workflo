name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, "p4/**"]
  # On-demand runs for validating a branch that is not main/develop.
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest-cov

      - name: Lint
        run: ruff check app/

      # This is a real gate: `|| true` used to hide real defects here, including
      # two shipped crashes (Url.rstrip AttributeError, and a Literal vocabulary
      # mismatch that broke the ownerless-asset path).
      - name: Type check
        run: mypy --ignore-missing-imports app/

      - name: Run tests
        env:
          USE_MOCK_DATAHUB: "true"
          AUTH_REQUIRED: "false"
        run: pytest -q --cov=app --cov-report=term-missing

      - name: Tests must not dirty tracked files
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no -- .)" ]; then
            echo "::error::The test suite modified tracked files under backend/."
            git status --porcelain --untracked-files=no -- .
            exit 1
          fi

  # The repository root is a pnpm project (package.json + pnpm-lock.yaml).
  # `pnpm install --frozen-lockfile`, `pnpm check` and `pnpm test` must work
  # from a clean checkout; CI verifies exactly those commands.
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Tests must not dirty tracked files
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::The test suite modified tracked files."
            git status --porcelain --untracked-files=no
            exit 1
          fi

  # Scaffolding explicitly destined for the sandbox worker (see its README and
  # PRODUCT_BOUNDARIES.md: disposition MERGE). It is P4-relevant - the model
  # router and safety gate sit between generated code and the sandbox - so its
  # 24 mock-based tests run here instead of rotting unobserved.
  ai-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workflo-ai-integration
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

  # One entry per Next.js app. The website shipped with broken JSX for a long
  # time because nothing in CI ever compiled it; every app is now built here.
  nextjs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, website, apps/dashboard]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Type check
        working-directory: ${{ matrix.app }}
        run: npx tsc --noEmit

      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, nextjs]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t workflo-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build -t workflo-frontend:${{ github.sha }} ./frontend

      - name: Validate compose file
        run: docker compose config -q

      # docker-compose.yml declares the dev *dependencies* (db/redis/minio) only;
      # it has no backend/frontend service, so the previous `curl localhost:8000`
      # smoke step could never pass. This exercises what the file actually
      # defines; an app-level compose smoke test needs service definitions (see
      # the product-boundary decisions in CODE_REVIEW.md).
      - name: Smoke test dev dependencies
        run: |
          docker compose up -d --wait
          ready=""
          for _ in 1 2 3 4 5; do
            if docker compose exec -T db pg_isready -U workflo; then ready=1; break; fi
            sleep 5
          done
          if [ -z "$ready" ]; then
            echo "::error::postgres did not become ready"
            docker compose logs db
            exit 1
          fi
          docker compose down -v
