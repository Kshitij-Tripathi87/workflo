name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main, develop, "p4/**"]
  push:
    branches: [main, develop, "p4/**", "arena/**"]
  # On-demand runs for validating a branch that is not main/develop.
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest-cov

      - name: Lint
        run: ruff check app/

      # This is a real gate: `|| true` used to hide real defects here, including
      # two shipped crashes (Url.rstrip AttributeError, and a Literal vocabulary
      # mismatch that broke the ownerless-asset path).
      - name: Type check
        run: mypy --ignore-missing-imports app/

      - name: Run tests
        env:
          USE_MOCK_DATAHUB: "true"
          AUTH_REQUIRED: "false"
        run: pytest -q --cov=app --cov-report=term-missing

      - name: Tests must not dirty tracked files
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no -- .)" ]; then
            echo "::error::The test suite modified tracked files under backend/."
            git status --porcelain --untracked-files=no -- .
            exit 1
          fi

  # The repository root is a pnpm project (package.json + pnpm-lock.yaml).
  # `pnpm install --frozen-lockfile`, `pnpm check` and `pnpm test` must work
  # from a clean checkout; CI verifies exactly those commands.
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Read the single pinned version from package.json packageManager.

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Tests must not dirty tracked files
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::The test suite modified tracked files."
            git status --porcelain --untracked-files=no
            exit 1
          fi

  # Active llama.cpp routing and safety package used by the worker. Unit tests
  # cover adapter discovery, structured generation, artifact pinning, and
  # compile/path safety; protected real-model acceptance runs separately.
  ai-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workflo-ai-integration
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run tests
        run: python -m pytest tests/ -v

  # One entry per Next.js app. The website shipped with broken JSX for a long
  # time because nothing in CI ever compiled it; every app is now built here.
  nextjs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, website, apps/dashboard]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Type check
        working-directory: ${{ matrix.app }}
        run: npx tsc --noEmit

      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, nextjs]
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Docker Hub when credentials are configured
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -u
          if [[ -n "${DOCKERHUB_USERNAME:-}" && -n "${DOCKERHUB_TOKEN:-}" ]]; then
            if printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin; then
              echo "::notice::Docker Hub authentication configured."
            else
              echo "::warning::Docker Hub login did not complete; bounded registry retries remain enabled."
            fi
          else
            echo "::notice::Docker Hub credentials are not configured; bounded retries will be used for anonymous pulls."
          fi

      - name: Build backend image
        run: bash scripts/ci/docker_build_retry.sh -t "workflo-backend:${{ github.sha }}" ./backend

      - name: Build frontend image
        run: bash scripts/ci/docker_build_retry.sh -t "workflo-frontend:${{ github.sha }}" ./frontend

      # Build the active Workflo services from the repository-root context.
      # These were not covered by the original Docker matrix, which only built
      # the legacy backend/frontend pair.
      - name: Build Workflo control-plane image
        run: bash scripts/ci/docker_build_retry.sh -t "workflo-control-plane:${{ github.sha }}" -f apps/control-plane/Dockerfile .

      - name: Build Workflo worker-engine image
        run: bash scripts/ci/docker_build_retry.sh -t "workflo-worker-engine:${{ github.sha }}" -f apps/worker-engine/Dockerfile .

      - name: Validate compose file
        run: docker compose config -q

      # docker-compose.yml declares the dev *dependencies* (db/redis/minio) only;
      # it has no backend/frontend service, so the previous `curl localhost:8000`
      # smoke step could never pass. This exercises what the file actually
      # defines; an app-level compose smoke test needs service definitions (see
      # the product-boundary decisions in CODE_REVIEW.md).
      - name: Smoke test dev dependencies
        run: |
          # Only these services are part of this readiness assertion. The
          # object-store container has its own image/runtime contract and is
          # not exercised by this database/Redis smoke test.
          docker compose up -d --wait db redis
          ready=""
          for _ in 1 2 3 4 5; do
            if docker compose exec -T db pg_isready -U workflo; then ready=1; break; fi
            sleep 5
          done
          if [ -z "$ready" ]; then
            echo "::error::postgres did not become ready"
            docker compose logs db
            exit 1
          fi
          docker compose down -v
