name: Worker Engine CI

on:
  push:
    paths:
      - "apps/worker-engine/**"
      - "worker/**"
      - "workflo-ai-integration/**"
      - "packages/workflo-schema/**"
      - "packages/workflo-utils/**"
      - "packages/probe-engine/**"
      - "packages/sandbox-runtime/**"
      - "scripts/release/**"
      - ".github/workflows/worker.yml"
  pull_request:
    paths:
      - "apps/worker-engine/**"
      - "worker/**"
      - "workflo-ai-integration/**"
      - "packages/workflo-schema/**"
      - "packages/workflo-utils/**"
      - "packages/probe-engine/**"
      - "packages/sandbox-runtime/**"
      - "scripts/release/**"
      - ".github/workflows/worker.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -e ./packages/workflo-schema
          pip install -e ./packages/workflo-utils
          # Local project dependency must be installed before workflo-worker
          # asks pip to resolve the internal distribution name.
          pip install -e ./packages/probe-engine
          pip install -e ./workflo-ai-integration
          pip install -e ./apps/worker-engine
          # The microVM execution slice (worker/) — depends only on schema.
          pip install -e ./worker
      # Separate steps so a failure names the exact suite in the job UI.
      - name: Test worker-engine
        run: python -m pytest -v apps/worker-engine/tests
      - name: Test gateway smoke
        run: python -m pytest -q packages/sandbox-runtime/tests/test_gateway_smoke.py
      # Worker host: protocol, manager, slice, transport, KVM-gated
      # integration (skips honestly without /dev/kvm + artifacts).
      - name: Test worker host (microVM slice)
        run: python -m pytest -q worker/tests

  docker:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      # The Dockerfile COPYs sibling workspace packages (packages/*,
      # workflo-ai-integration/*), so the build context is the repository
      # root. Passing apps/worker-engine as the context made every COPY of a
      # repo-root path fail ("/apps/worker-engine/src: not found").
      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          file: apps/worker-engine/Dockerfile
          push: false
          tags: workflo/worker-engine:latest
