name: Worker Engine CI

on:
  push:
    paths:
      - "apps/worker-engine/**"
      - "workflo-ai-integration/**"
      - "packages/workflo-schema/**"
      - "packages/workflo-utils/**"
      - "packages/probe-engine/**"
      - "packages/sandbox-runtime/**"
      - "scripts/release/**"
      - ".github/workflows/worker.yml"
  pull_request:
    paths:
      - "apps/worker-engine/**"
      - "workflo-ai-integration/**"
      - "packages/workflo-schema/**"
      - "packages/workflo-utils/**"
      - "packages/probe-engine/**"
      - "packages/sandbox-runtime/**"
      - "scripts/release/**"
      - ".github/workflows/worker.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -e ./packages/workflo-schema
          pip install -e ./packages/workflo-utils
          # Local project dependency must be installed before workflo-worker
          # asks pip to resolve the internal distribution name.
          pip install -e ./packages/probe-engine
          pip install -e ./workflo-ai-integration
          pip install -e ./apps/worker-engine
      - name: Run tests
        run: |
          python -m pytest -v apps/worker-engine/tests
          python -m pytest -q packages/sandbox-runtime/tests/test_gateway_smoke.py

  docker:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v5
        with:
          context: apps/worker-engine
          push: false
          tags: workflo/worker-engine:latest
