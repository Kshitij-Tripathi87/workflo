name: Regenerate agentic JSON Schemas

on:
  push:
    branches:
      - feature/agentic-contracts-phase-a
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor == 'Kshitij-Tripathi87'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema export dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packages/workflo-schema/requirements-schema-export.txt \
            -e "./packages/workflo-schema[dev]" -e ./packages/sandbox-isolation
      - name: Regenerate canonical schemas
        run: python packages/workflo-schema/scripts/export_schemas.py
      - name: Commit generated schemas
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- packages/workflo-schema/schemas/v1; then
            echo "Canonical JSON Schema exports are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/workflo-schema/schemas/v1
          git commit -m "chore: regenerate canonical JSON schemas"
          git push origin "HEAD:${GITHUB_REF_NAME}"
