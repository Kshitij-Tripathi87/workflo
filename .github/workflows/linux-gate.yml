name: linux-gate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Gate 3 of the launch candidate: the REAL sandbox path.
# The unit/mock suite proves logic on every platform; THIS workflow proves
# kernel-level isolation (bwrap + cgroups v2 + netns + seccomp + Landlock)
# on its target platform, plus the golden runs end-to-end through the real
# CLI surface. Fail-closed: a failure anywhere blocks the merge.

on:
  push:
    branches: [main, "p4/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-sandbox-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4, commit resolved by current GitHub runner

      - name: "Preflight: verify isolation prerequisites exist"
        run: |
          echo "Checking for required scripts and test directories..."
          for path in \
            scripts/linux/setup_env.sh \
            scripts/linux/golden_run.sh \
            scripts/linux/agent_golden_run.sh \
            scripts/linux/planner_golden_run.sh \
            packages/sandbox-runtime/tests/integration \
          ; do
            if [ ! -e "$path" ]; then
              echo "MISSING: $path"
              exit 1
            fi
          done
          echo "All prerequisites present."

      # Installs bubblewrap/nftables/dnsmasq, builds the runtime image at
      # /opt/workflo/workflo-worker, installs all workflo packages into
      # /opt/workflo/venv, and creates the /root/wf-fixture repo.
      # JUSTIFIED: Root required for cgroup/netns setup on Linux.
      - name: Provision isolation stack
        id: provision
        run: sudo bash scripts/linux/setup_env.sh

      # NOTE: this suite imports sibling packages (workflo_worker,
      # sandbox_isolation, probe_engine, ...) that scripts/linux/setup_env.sh
      # installs into /opt/workflo/venv - it is not self-contained.
      - name: Agent-layer unit suites (mock gate)
        run: |
          /opt/workflo/venv/bin/python -m pytest \
            packages/sandbox-runtime/tests \
            packages/workflo-schema/tests \
            --ignore packages/sandbox-runtime/tests/integration \
            -q -x --junitxml=/tmp/linux-gate-unit.xml

      # Exit status alone cannot tell "476 tests verified isolation logic" from
      # "the suite collected nothing and skipped the rest".
      - name: Assert the unit suite actually executed
        if: always()
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          MIN_EXECUTED = 400  # suite currently executes 476; a lower number means tests vanished
          path = "/tmp/linux-gate-unit.xml"
          try:
              root = ET.parse(path).getroot()
          except FileNotFoundError:
              sys.exit(f"::error::no junit report at {path} - the unit step did not run")

          suites = [root] if root.tag == "testsuite" else root.findall(".//testsuite")
          total = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          failed = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites)
          executed = total - skipped
          print(f"collected={total} executed={executed} skipped={skipped} failed={failed}")

          if failed:
              sys.exit(f"::error::{failed} unit test(s) failed")
          if executed < MIN_EXECUTED:
              sys.exit(f"::error::only {executed} unit tests executed (expected >= {MIN_EXECUTED})")
          print(f"[ok] {executed} unit tests executed")
          PY

      # JUSTIFIED: Root required for real namespace/cgroup/landlock testing.
      - name: Linux integration gate (root, real namespaces)
        run: |
          sudo -E /opt/workflo/venv/bin/python -m pytest \
            packages/sandbox-runtime/tests/integration -q -v \
            --junitxml=/tmp/linux-gate-integration.xml

      # The authoritative isolation gate. These tests skip whenever a capability
      # is missing (not root, no bwrap/nft/dnsmasq, runtime image absent, kernel
      # without Landlock), so a half-provisioned runner would report "33 skipped,
      # 0 failed" and exit 0 - a green gate that verified nothing. Skips are
      # therefore a FAILURE here: a security test that only passes because the
      # capability was skipped is not an authoritative security gate.
      - name: Assert the integration gate actually executed
        if: always()
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          MIN_EXECUTED = 30  # suite has 33 tests; fewer means tests were removed
          path = "/tmp/linux-gate-integration.xml"
          try:
              root = ET.parse(path).getroot()
          except FileNotFoundError:
              sys.exit(f"::error::no junit report at {path} - the integration step did not run")

          suites = [root] if root.tag == "testsuite" else root.findall(".//testsuite")
          total = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          failed = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites)
          executed = total - skipped
          print(f"collected={total} executed={executed} skipped={skipped} failed={failed}")

          # Expand each skip into a concrete test name and reason. This is
          # diagnostic only: every skip still fails the authoritative gate.
          import os
          skipped_cases = []
          for suite in suites:
              for case in suite.findall(".//testcase"):
                  skipped_node = case.find("skipped")
                  if skipped_node is not None:
                      reason = (skipped_node.get("message") or "").strip()
                      body = (skipped_node.text or "").strip()
                      if body:
                          reason = f"{reason}: {body}" if reason else body
                      skipped_cases.append((
                          case.get("classname", "<unknown>"),
                          case.get("name", "<unnamed>"),
                          reason or "no skip reason recorded",
                      ))

          problems = []
          if skipped:
              problems.append(
                  f"{skipped} integration test(s) skipped, so the isolation claims were "
                  "not fully exercised. Every skipped test must be investigated."
              )
          if executed < MIN_EXECUTED:
              problems.append(f"only {executed} tests executed (expected >= {MIN_EXECUTED})")
          if failed:
              problems.append(f"{failed} test(s) failed")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          summary = [
              "## Linux isolation integration gate",
              "",
              f"- Collected: **{total}**",
              f"- Executed: **{executed}**",
              f"- Skipped: **{skipped}**",
              f"- Failed/errors: **{failed}**",
              "",
          ]
          if skipped_cases:
              summary += ["### Skipped tests (gate failure)", ""]
              for cls, name, reason in skipped_cases:
                  entry = f"- `{cls}::{name}` — {reason}"
                  print("SKIPPED TEST: " + entry)
                  summary.append(entry)
          if problems:
              summary += ["", "### Gate failures", ""] + [f"- {p}" for p in problems]
          else:
              summary.append("All required integration tests executed without skips.")

          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(summary) + "\n")

          if problems:
              for problem in problems:
                  escaped = (problem.replace("%", "%25").replace("\r", "%0D")
                                    .replace("\n", "%0A").replace(":", "%3A").replace(",", "%2C"))
                  print(f"::error title=Linux isolation gate::{escaped}")
              for cls, name, reason in skipped_cases:
                  detail = f"{cls}::{name}: {reason}"
                  escaped = (detail.replace("%", "%25").replace("\r", "%0D")
                                   .replace("\n", "%0A").replace(":", "%3A").replace(",", "%2C"))
                  print(f"::error title=Skipped security test::{escaped}")
              sys.exit(1)
          print(f"[ok] isolation gate executed: {executed} tests, no skips")
          PY

      # These runs continue after an integration assertion failure, provided
      # provisioning succeeded, so a failed gate still emits diagnostic receipts.
      # A failed gate remains failed; this does not bypass the release criterion.
      # JUSTIFIED: Root required for bwrap + namespace isolation.
      - name: Namespaces golden run (tests tier)
        if: ${{ always() && steps.provision.outcome == 'success' }}
        run: sudo -E bash scripts/linux/golden_run.sh

      # JUSTIFIED: Root required for deep-tier app + governed agent isolation.
      - name: "Agent golden run (deep tier: app + governed agent)"
        if: ${{ always() && steps.provision.outcome == 'success' }}
        run: sudo -E bash scripts/linux/agent_golden_run.sh

      # JUSTIFIED: Root required for planner-mode isolation with real LLM.
      - name: Planner golden run (scripted LLM planner)
        if: ${{ always() && steps.provision.outcome == 'success' }}
        run: sudo -E bash scripts/linux/planner_golden_run.sh

      # Copy root-owned receipts into the workspace first. Artifact actions
      # run as the hosted runner user and cannot traverse /root (mode 0700).
      - name: Collect golden run receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts/golden-runs"
          for base in wf-golden wf-agent-golden wf-planner-golden; do
            source_dir="/root/$base/.workflo/runs"
            target_dir="$GITHUB_WORKSPACE/artifacts/golden-runs/$base"
            mkdir -p "$target_dir"
            if sudo test -d "$source_dir"; then
              while IFS= read -r -d '' receipt; do
                relative="${receipt#"$source_dir"/}"
                mkdir -p "$target_dir/$(dirname "$relative")"
                sudo cp "$receipt" "$target_dir/$relative"
              done < <(sudo find "$source_dir" -type f -name receipt.json -print0)
            fi
          done
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/artifacts/golden-runs"

      # Upload golden run artifacts for verification
      - name: Upload golden run receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-run-receipts
          path: artifacts/golden-runs/**/*.json
          if-no-files-found: warn
          retention-days: 30
