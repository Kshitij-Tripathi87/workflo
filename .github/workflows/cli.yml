name: CLI Agent CI

on:
  push:
    paths:
      - "apps/agent-cli/**"
      - "packages/workflo-schema/**"
      - "packages/workflo-utils/**"
      - ".github/workflows/cli.yml"
  pull_request:
    paths:
      - "apps/agent-cli/**"
      - "packages/workflo-schema/**"
      - "packages/workflo-utils/**"
      - ".github/workflows/cli.yml"

# Least privilege: these jobs only read the checkout and use repository
# secrets; none of them create releases, comment, or push.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -e ./packages/workflo-schema
          pip install -e ./packages/workflo-utils
          pip install -e ./apps/agent-cli
          pip install pytest
      - name: Run tests
        run: |
          cd apps/agent-cli && pytest -v
