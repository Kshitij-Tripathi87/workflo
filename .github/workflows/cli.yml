name: CLI Agent CI

on:
  push:
    paths:
      - "apps/agent-cli/**"
      - "packages/workflo-schema/**"
      - "packages/workflo-utils/**"
  pull_request:
    paths:
      - "apps/agent-cli/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -e ./packages/workflo-schema
          pip install -e ./packages/workflo-utils
          pip install -e ./apps/agent-cli
      - name: Run tests
        run: |
          cd apps/agent-cli && pytest -v
