name: CLI Agent CI

on:
  push:
    paths:
      - "apps/agent-cli/**"
      - "packages/workflo-schema/**"
      - "packages/workflo-utils/**"
      - ".github/workflows/cli.yml"
  pull_request:
    paths:
      - "apps/agent-cli/**"
      - "packages/workflo-schema/**"
      - "packages/workflo-utils/**"
      - ".github/workflows/cli.yml"

# Least privilege: these jobs only read the checkout and use repository
# secrets; none of them create releases, comment, or push.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -e ./packages/workflo-schema
          pip install -e ./packages/workflo-utils
          pip install -e ./apps/agent-cli
          pip install pytest
      - name: Run tests
        run: |
          cd apps/agent-cli && pytest -v
