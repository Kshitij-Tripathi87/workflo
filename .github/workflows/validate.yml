name: Architecture Review

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Required for SARIF upload
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for merge-base baseline

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # FAIL-LOUD: a missing or renamed gate dependency must abort the
      # workflow. Silently swallowing install failures would let the pipeline
      # report "gates ran" when they may not have actually executed.
      #
      # Every install is a local path with its dev extras. The gates shell out
      # to `python -m pytest` inside the clone, so the test tooling (including
      # pytest-asyncio for the control-plane suite) has to be installed here;
      # plain `pip install -e <local path>` also cannot resolve sibling
      # distributions by name, so the packages go in dependency order.
      - name: Install validation CLI and gate dependencies
        run: |
          pip install --upgrade pip
          pip install -e "./packages/workflo-schema"
          pip install -e "./packages/workflo-utils"
          pip install -e "./packages/sandbox-isolation"
          pip install -e "./packages/probe-engine"
          pip install -e "./workflo-ai-integration"
          pip install -e "./packages/sandbox-runtime"
          pip install -e "./apps/sandbox-executor"
          pip install -e "./supervisor"
          pip install -e "./packages/cortex-auth[dev]"
          pip install -e "./apps/control-plane[dev]"
          pip install -e "./apps/workflo-cli[dev]"
          pip install -e "./apps/validation-cli[dev]"

      - name: Run architecture review
        id: validate
        env:
          MODEL_ENDPOINT: ${{ secrets.VLLM_ENDPOINT }}
          MODEL_NAME: ${{ vars.VLLM_MODEL }}
        run: |
          validate-phase2 \
            --repo . \
            --output ./reports \
            --formats sarif,md,json,html
        continue-on-error: true # Reports are still written on failure

      # The LLM half of the review is optional; the gates are not. Say so in
      # the run summary instead of letting a gates-only run look like a full
      # review that found nothing.
      - name: Summarise review coverage
        if: always()
        run: |
          {
            echo "## Architecture review"
            echo
            if [ -s ./reports/validation_report.sarif ]; then
              echo "- Reports: written to \`./reports\` (sarif, md, json, html)"
            else
              echo "- Reports: **none written** — the pipeline stopped before reporting"
            fi
            if [ -n "${MODEL_ENDPOINT:-}" ]; then
              echo "- Model analysis: endpoint configured (\`${MODEL_NAME:-default model}\`)"
            else
              echo "- Model analysis: **skipped — \`VLLM_ENDPOINT\` is not configured**, so this run covers the gates only"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && hashFiles('reports/validation_report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ./reports/validation_report.sarif
          category: validate-phase2

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: ./reports/
          if-no-files-found: warn

      - name: Fail job on critical findings or gate failures
        if: steps.validate.outcome == 'failure'
        run: |
          echo "::error::Architecture review found critical/high issues or gate failures. See SARIF for details."
          exit 1
