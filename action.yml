name: "Workflo QA Tests"
description: "Run a Workflo QA run in an isolated sandbox and emit a signed execution receipt. Requires the Workflo repository (or a runner image that provides the workflo CLI)."
author: "Workflo"
branding:
  icon: "shield"
  color: "blue"

inputs:
  results-path:
    description: "Where to write the JSON results file (run receipt, or the validated run plan in dry-run mode)"
    required: false
    default: "reports/workflo-results.json"
  tiers:
    description: "Comma-separated probe tiers: test,security (security also needs start-command and port)"
    required: false
    default: "test"
  start-command:
    description: "Command that starts the application under test (required by the security tier)"
    required: false
    default: ""
  port:
    description: "Port the application under test binds (required by the security tier)"
    required: false
    default: ""
  config-file:
    description: "Optional Workflo config file (YAML or JSON) passed with --config"
    required: false
    default: ""
  dry-run:
    description: "Validate the run plan and exit 0 without cloning or starting a sandbox"
    required: false
    default: "false"
  python-version:
    description: "Python version to set up"
    required: false
    default: "3.11"
  install-playwright:
    description: "Install Playwright browsers (only needed for browser probes)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    # The Workflo CLI is distributed as an npm wrapper plus vendored wheels;
    # there is no PyPI `workflo` distribution to `pip install`. The action
    # therefore runs the CLI from the checked-out repository, in dependency
    # order, and refuses to continue instead of installing something else.
    - name: Install Workflo CLI
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        if [ ! -d apps/workflo-cli ]; then
          echo "::error::apps/workflo-cli not found in $GITHUB_WORKSPACE."
          echo "::error::Check out the Workflo repository before using this action:"
          echo "::error::  - uses: actions/checkout@v4"
          echo "::error::    with: { repository: Kshitij-Tripathi87/workflo }"
          exit 1
        fi
        pip install -e ./packages/workflo-schema \
                    -e ./packages/workflo-utils \
                    -e ./packages/sandbox-isolation \
                    -e ./packages/sandbox-runtime \
                    -e ./packages/probe-engine \
                    -e ./apps/sandbox-executor \
                    -e ./supervisor \
                    -e ./packages/cortex-auth
        pip install -e ./apps/workflo-cli
        workflo --version
        if [ "${{ inputs.install-playwright }}" = "true" ]; then
          python -m playwright install chromium --with-deps || python -m playwright install chromium
        fi

    - name: Run Workflo
      id: workflo
      shell: bash
      env:
        TIERS: ${{ inputs.tiers }}
        START_COMMAND: ${{ inputs.start-command }}
        PORT: ${{ inputs.port }}
        CONFIG_FILE: ${{ inputs.config-file }}
        RESULTS: ${{ inputs.results-path }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail
        mkdir -p "$(dirname "$RESULTS")"

        args=(run --path . --output "$RESULTS")
        [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
        [ -f "$CONFIG_FILE" ] && args+=(--config "$CONFIG_FILE")

        IFS=',' read -ra requested <<< "$TIERS"
        for tier in "${requested[@]}"; do
          case "$(echo "$tier" | tr -d '[:space:]')" in
            test) args+=(--test) ;;
            security) args+=(--security) ;;
            "") ;;
            *)
              echo "::error::Unknown tier '$tier'. Supported tiers: test, security."
              exit 2
              ;;
          esac
        done

        if [ -n "$START_COMMAND" ]; then args+=(--start-command "$START_COMMAND"); fi
        if [ -n "$PORT" ]; then args+=(--port "$PORT"); fi

        echo "workflo ${args[*]}"
        workflo "${args[@]}"

    - name: Check the results file
      shell: bash
      env:
        RESULTS: ${{ inputs.results-path }}
      run: |
        set -euo pipefail
        if [ ! -s "$RESULTS" ]; then
          echo "::error::No Workflo results written to $RESULTS"
          exit 1
        fi
        echo "Results written to $RESULTS"

    - name: Upload results JSON
      uses: actions/upload-artifact@v4
      with:
        name: workflo-results
        path: ${{ inputs.results-path }}
        if-no-files-found: error
