[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workflo-schema"
version = "0.1.0"
description = "Shared Pydantic schemas for the workflo platform — the single source of truth for RunSpec, TestResult, and auth models."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "workflo" }]
dependencies = ["pydantic>=2.5.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workflo_schema = ["py.typed"]
