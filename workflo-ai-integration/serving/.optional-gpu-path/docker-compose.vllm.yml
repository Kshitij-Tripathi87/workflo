# Optional GPU upgrade — see README.md in this directory.
# Default serving is ../docker-compose.llamacpp.yml (llama.cpp).
#
# Base model loaded once; adapters registered at startup and hot-swappable
# via /v1/load_lora_adapter. model_router.py's public interface does not
# change if you switch backends later.
#
# Isolation is the sandbox runner's job (--network none, P4 teardown), not
# this file's.

version: "3.9"

services:
  vllm-server:
    image: vllm/vllm-openai:latest
    command: >
      --model Qwen/Qwen3-Coder-7B-Instruct
      --dtype fp16
      --enable-lora
      --max-loras 4
      --max-lora-rank 32
      --max-cpu-loras 8
      --lora-modules
        test-gen=/adapters/test-gen
        reasoning=/adapters/reasoning
        reporting=/adapters/reporting
      --max-num-seqs 16
      --gpu-memory-utilization 0.85
    environment:
      - VLLM_ALLOW_RUNTIME_LORA_UPDATING=True
    volumes:
      - ../adapters:/adapters:ro
    expose:
      - "8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
