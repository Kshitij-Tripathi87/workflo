[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workflo-worker-host"
version = "0.1.0"
description = "Host-side microVM sandbox manager for Workflo — Firecracker/KVM execution plane (Phase 3)."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "workflo" }]
dependencies = [
    "pydantic>=2.5.0",
    "workflo-schema>=1.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workflo_worker_host = ["py.typed"]
