# vLLM server for Qwen2.5-Coder-7B-AWQ (drop-in placeholder for Qwen3-9B-AWQ
# when released). Serves an OpenAI-compatible /v1/chat/completions API.
#
# Memory budget on Oracle ARM Ampere Free Tier (24 GB):
#   - 7B-AWQ: ~6 GB
#   - 14B-AWQ: ~10 GB (leave 14 GB for sandbox containers)
#   - 9B-AWQ (future): ~8 GB
#
# To swap to Qwen3-9B when released, change MODEL below and restart:
#   docker compose -f infra/vllm/docker-compose.yml up -d --force-recreate

services:
  vllm:
    image: vllm/vllm-openai:latest-arm64
    container_name: vllm
    command:
      - "--model=Qwen/Qwen2.5-Coder-7B-AWQ"
      - "--quantization=awq"
      - "--max-model-len=32768"
      - "--gpu-memory-utilization=0.85"
      - "--enforce-eager"
      - "--max-num-seqs=4"
      - "--host=0.0.0.0"
      - "--port=8000"
    environment:
      - HF_HUB_ENABLE_HF_TRANSFER=1
      - VLLM_USE_V1=1
    ports:
      - "8000:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  hf-cache:
