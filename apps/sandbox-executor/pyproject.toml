[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workflo-executor"
version = "0.1.0"
description = "The workflo sandbox executor — per-job ephemeral lifecycle wrapper tying mount_tmpfs + Docker container + worker-engine payload + teardown + receipt signing together."
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "workflo" }]
dependencies = [
    "pydantic>=2.5.0",
    "tenant-shield-schema",
    "airlock-sandbox-isolation",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]
