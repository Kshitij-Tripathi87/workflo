[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workflo-agent"
version = "0.1.0"
description = "The workflo interactive CLI agent — goal-based test orchestration, local + cloud execution."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "workflo" }]
dependencies = [
    "click>=8.1.0",
    "rich>=13.7.0",
    "questionary>=2.0.0",
    "httpx>=0.26.0",
    "pyyaml>=6.0",
    "workflo-schema",
    "workflo-utils",
]
[project.scripts]
workflo = "workflo_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
