[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workflo-control-plane"
version = "0.1.0"
description = "The workflo Control Plane — FastAPI backend for auth, run orchestration, and results."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "workflo" }]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "argon2-cffi>=23.1.0",
    "workflo-schema",
    "workflo-utils",
    "workflo-executor",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29.0"]
redis = ["redis>=5.0.0", "celery>=5.3.0"]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
