[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workflo-cli"
version = "0.1.0"
description = "The workflo CLI — `workflo run --repo <repo-url> --test --security` runs the sandboxed test pipeline end-to-end."
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "workflo" }]
dependencies = [
    "pydantic>=2.5.0",
    "click>=8.1.0",
    "cryptography>=42.0.0",
    "pyyaml>=6.0",
    "httpx>=0.26.0",
    "workflo-schema",
    "sandbox-isolation",
    "workflo-executor",
    "workflo-probe-engine",
    "cortex-auth",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.0"]

[project.scripts]
workflo = "workflo_cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
